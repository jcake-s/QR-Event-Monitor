<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Event Monitor System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="html5-qrcode.min.js" type="text/javascript"></script>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="page-wrapper">
        <header>
            <div class="header-icon">🎟️</div>
            <div class="header-text">
                <h1>Event Monitor</h1>
                <p>Real-time guest entry &amp; exit tracker</p>
            </div>
            <span id="connection-status" class="connection-badge">Connecting </span>
        </header>

        <main class="dashboard-container">
            <section class="glass-card scanner-section">
                <h2><span class="section-dot dot-blue"></span> Live Scanner</h2>
                <div id="reader"></div>
                <div id="scanner-message">Ready to scan</div>
            </section>

            <section class="glass-card log-section">
                <h2><span class="section-dot dot-purple"></span> Activity Log</h2>
                <div id="status-card" class="card-neutral">
                    <div class="log-icon" id="log-icon">👤</div>
                    <h3 id="log-guest-name">No Scan Detected</h3>
                    <p id="log-guest-id">Scan a guest QR code to begin tracking.</p>
                    <div id="log-badge" class="badge">Awaiting Scan</div>
                    <p id="log-time"></p>
                </div>
            </section>
        </main>

        <footer class="public-footer">
            <a href="/admin">Staff Admin</a>
        </footer>
    </div>

    <script src="scanner.js"></script>
</body>
</html>
