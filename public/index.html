<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Event Monitor System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="html5-qrcode.min.js" type="text/javascript"></script>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="page-wrapper">
        <header>
            <div class="header-icon"> </div>
            <div class="header-text">
                <h1>Event Monitor</h1>
                <p>Real-time guest entry &amp; exit tracker</p>
            </div>
            <span id="connection-status" class="connection-badge icon-only" title="Connecting...">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="connection-icon icon-online"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="connection-icon icon-offline"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
            </span>
        </header>

        <main class="dashboard-container">
            <section class="glass-card scanner-section">
                <h2><span class="section-dot dot-blue"></span> Live Scanner</h2>
                <div id="reader"></div>
                <div id="scanner-message">Ready to scan</div>
            </section>

            <section class="glass-card log-section">
                <h2><span class="section-dot dot-purple"></span> Activity Log</h2>
                <div id="status-card" class="card-neutral">
                    <div class="log-icon" id="log-icon">👤</div>
                    <h3 id="log-guest-name">No Scan Detected</h3>
                    <p id="log-guest-id">Scan a guest QR code to begin tracking.</p>
                    <div id="log-badge" class="badge">Awaiting Scan</div>
                    <p id="log-time"></p>
                </div>
            </section>
        </main>

        <footer class="public-footer">
            <a href="/admin">Staff Admin</a>
        </footer>
    </div>

    <script src="scanner.js"></script>
</body>
</html>
